<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Empresa</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div class="container">
    <h2>Cadastro de Empresa</h2>

    <form onsubmit="cadastrarEmpresa(event)">
        <input id="nome" type="text" placeholder="Nome da empresa" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="cnpj" type="text" placeholder="CNPJ" required>
        <input id="estado" type="text" placeholder="Estado" required>
        <input id="cep" type="number" placeholder="CEP" required>
        <input id="skills" type="text" placeholder="Skills buscadas (ex: Java, TS)" required>
        <textarea id="descricao" placeholder="Descrição" required></textarea>

        <button type="submit">Cadastrar</button>
    </form>
    
    <a href="cad_vaga.html">Cadastrar vaga</a>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
