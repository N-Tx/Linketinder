<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Candidato</title>
    <link rel="stylesheet" href="/src/style.css">
    
</head>
<body>

<div class="container">
    <h2>Cadastro de Candidato</h2>

    <form onsubmit="cadastrarCandidato(event)">
        <input id="nome" type="text" placeholder="Nome" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="idade" type="number" placeholder="Idade" required>
        <input id="estado" type="text" placeholder="Estado" required>
        <input id="cep" type="number" placeholder="CEP" required>
        <input id="skills" type="text" placeholder="Skills (Java, TS)" required>
        <textarea id="descricao" placeholder="Descrição" required></textarea>

        <button type="submit">Cadastrar</button>
    </form>
    
   <a href="/src/perfil_candidato.html">Ir para perfil</a>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
